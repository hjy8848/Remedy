[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remedy"
version = "0.1.0"
description = "Autonomous experiment synthesis for recursive agent improvement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alfworld>=0.4.2",
  "numpy>=1.24",
  "peft>=0.12",
  "PyYAML>=6.0",
  "textworld[pddl]>=1.6.1",
  "torch>=2.2",
  "transformers>=4.45",
]

[project.optional-dependencies]
verl = [
  "verl @ git+https://github.com/HaozheZhang6/verl.git@9268aad322df93cc61e9c168d66d395256dbe87a",
  "cachetools",
  "TransferQueue==0.1.8",
  "fastapi",
  "uvicorn",
]
verl-gpu = [
  "verl[vllm] @ git+https://github.com/HaozheZhang6/verl.git@9268aad322df93cc61e9c168d66d395256dbe87a",
  "torch==2.8.0+cu128",
  "torchvision==0.23.0+cu128",
  "torchaudio==2.8.0+cu128",
  "vllm==0.11.0",
  "xformers==0.0.32.post1",
  "transformers==4.55.2",
  "tokenizers==0.21.1",
  "huggingface-hub==0.34.3",
  "cachetools",
  "TransferQueue==0.1.8",
  "swanlab",
  "fastapi",
  "uvicorn",
]

[project.scripts]
remedy = "experiment_rsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
experiment_rsi = ["*.yaml"]
