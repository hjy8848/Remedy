model:
  path: /home/shenyl/hf/model/Qwen/Qwen2.5-1.5B-Instruct
  revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
  device: cuda
  dtype: bfloat16
  max_new_tokens: 256
  editor_max_new_tokens: 2048
  temperature: 0.7
  top_p: 0.9
  lora:
    r: 4
    alpha: 8
    dropout: 0.0
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

alfworld:
  config_path: configs/alfworld_text.yaml
  split: eval_in_distribution
  game_file: null

worker:
  image: python:3.11-slim
  timeout_seconds: 10
  startup_timeout_seconds: 120

run:
  seed: 7
  max_steps: 30

training:
  learning_rate: 0.00001
  gradient_checkpointing: true

research:
  diagnostic_split: train
  diagnostic_games_per_period: 10
  experiment_split: train
  experiments_per_group: 4
  edits_per_branch: 2

tracking:
  project_name: Remedy-Designer-Only
  experiment_name: designer-only-contrastive-grpo
  logger: [console, swanlab]
